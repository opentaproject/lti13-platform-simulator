<!DOCTYPE html>
<html>
<head><title>Launching {{ registration.name }}</title></head>
<body>
  <p>Launching {{ registration.name }}...</p>
  <form method="post">
    {% csrf_token %}
    <label>target_link_uri <input type="text" name="target_link_uri" value="{{ target_link_uri }}" size="60"></label><br>
    <label>context_id <input type="text" name="context_id" value="{{ context_id }}" size="60"></label><br>
    <label>context_label <input type="text" name="context_label" value="{{ context_label }}" size="60"></label><br>
    <label>context_title <input type="text" name="context_title" value="{{ context_title }}" size="60"></label><br>
    <button type="submit">Continue to OIDC Init</button>
  </form>
</body>
</html>
